name: Build Android Release APK

on:
  push:
    branches: [ "master" ]
    tags: [ "v*" ]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Release commit or version tag to release (empty: just build the branch)'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # All history and tags, to look through every commit of a push and at existing tags.
          fetch-depth: 0

      # Release v2026.10-2 by any of:
      # - pushing a "Release v2026.10-2" commit to master, alone or with other commits;
      # - pushing a v2026.10-2 tag;
      # - running this workflow by hand with that commit or tag as the ref input.
      # The APK is built from the release commit, which gets tagged if it is not already, and the
      # release is described by the "=2026.10-2=" section of changelog.md.
      - name: Detect release
        id: release
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          BEFORE: ${{ github.event.before }}
          INPUT_REF: ${{ inputs.ref }}
        run: |
          # Prints the tag of a "Release v2026.10-2" commit, and fails for any other commit.
          release_tag() {
            [[ "$(git log -1 --format=%s "$1")" =~ ^Release\ (v[^[:space:]]+)$ ]] && echo "${BASH_REMATCH[1]}"
          }

          TAG=""
          if [[ "$REF_TYPE" == "tag" ]]; then
            TAG=$REF_NAME
            SHA=$(git rev-parse "refs/tags/$TAG^{commit}")
          elif [[ -n "$INPUT_REF" ]]; then
            if ! SHA=$(git rev-parse -q --verify "$INPUT_REF^{commit}"); then
              echo "::error::Unknown ref $INPUT_REF."
              exit 1
            fi
            if git show-ref -q --verify "refs/tags/$INPUT_REF"; then
              TAG=$INPUT_REF
            elif ! TAG=$(release_tag "$SHA"); then
              echo "::error::$INPUT_REF is neither a release commit nor a tag."
              exit 1
            fi
          else
            # The newest release commit of the push. Without a usable before commit (a new branch,
            # a force push, a manual run), only the head commit counts.
            if [[ "$EVENT" == "push" ]] && git cat-file -e "$BEFORE^{commit}" 2> /dev/null; then
              RANGE=("$BEFORE..$GITHUB_SHA")
            else
              RANGE=(-1 "$GITHUB_SHA")
            fi
            for SHA in $(git rev-list "${RANGE[@]}"); do
              TAG=$(release_tag "$SHA") && break
            done
            if [[ -z "$TAG" ]]; then
              echo "Not a release commit."
              exit 0
            fi
          fi
          VERSION="${TAG#v}"
          echo "Release $TAG is commit $SHA."

          TAG_SHA=$(git rev-parse -q --verify "refs/tags/$TAG^{commit}" || true)
          if [[ -n "$TAG_SHA" && "$TAG_SHA" != "$SHA" ]]; then
            echo "::error::Tag $TAG already exists on $TAG_SHA."
            exit 1
          fi
          # A release commit pushed together with its tag is released by the tag's own run.
          if [[ -n "$TAG_SHA" && "$REF_TYPE" == "branch" && -z "$INPUT_REF" ]]; then
            echo "Tag $TAG already marks this commit, so its own run releases it."
            exit 0
          fi
          # GITHUB_TOKEN may not create a tag on a commit whose workflow files differ from the branch
          # tip, as GitHub counts that as changing workflows, so that tag has to be pushed by hand.
          # Naming such a commit as the release target is refused too, even when the tag exists, so the
          # release only names its commit when it has to create the tag.
          if [[ -z "$TAG_SHA" ]] && ! git diff --quiet "$SHA" "$GITHUB_SHA" -- .github/workflows; then
            echo "::error::.github/workflows changed since $SHA, so this run cannot create tag $TAG on it. Push it with 'git tag $TAG $SHA && git push origin $TAG', then run this workflow with $TAG as the ref input."
            exit 1
          fi

          git checkout --quiet --detach "$SHA"
          if ! grep -q "versionName = \"$VERSION\"" app/build.gradle; then
            echo "::error::versionName in app/build.gradle is not $VERSION."
            exit 1
          fi

          # The section runs from its heading, minus the ==== underline, to the next heading.
          awk -v heading="=$VERSION=" '
            $0 == heading { found = 1; getline; next }
            found && /^=.+=$/ { exit }
            found { print }
          ' changelog.md > "$RUNNER_TEMP/release_notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/release_notes.md"; then
            echo "::error::No =$VERSION= section in changelog.md."
            exit 1
          fi

          echo "tag=$TAG" >> $GITHUB_OUTPUT
          if [[ -z "$TAG_SHA" ]]; then
            echo "target=$SHA" >> $GITHUB_OUTPUT
          fi
          echo "notes=$RUNNER_TEMP/release_notes.md" >> $GITHUB_OUTPUT

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Unsigned Release APKs
        run: ./gradlew assembleRelease -PabiSplits

      - name: Setup build tool version variable
        shell: bash
        run: |
          BUILD_TOOLS_VERSION=$(ls /usr/local/lib/android/sdk/build-tools/ | tail -n 1)
          echo "BUILD_TOOLS_VERSION=$BUILD_TOOLS_VERSION" >> $GITHUB_ENV
          echo "Using pre-installed Build Tools Version: $BUILD_TOOLS_VERSION"

      - name: Sign Release APKs
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: ${{ env.BUILD_TOOLS_VERSION }}

      # app-arm64-v8a-release-unsigned-signed.apk becomes ClimbTheWorld-Release-arm64-v8a.apk, and so
      # on for each CPU type and for the universal APK. The signed files are found by name, as the
      # signing action's signedReleaseFiles output is always empty: its v1 code only sets
      # signedReleaseFile, to the last file it signed.
      - name: Rename Signed APKs
        shell: bash
        run: |
          shopt -s nullglob
          FILES=(app/build/outputs/apk/release/app-?*-release-unsigned-signed.apk)
          if (( ${#FILES[@]} == 0 )); then
            echo "::error::No signed APKs in app/build/outputs/apk/release."
            exit 1
          fi
          for OLD_PATH in "${FILES[@]}"; do
            [[ "$(basename "$OLD_PATH")" =~ ^app-(.+)-release-unsigned-signed\.apk$ ]]
            mv "$OLD_PATH" "$(dirname "$OLD_PATH")/ClimbTheWorld-Release-${BASH_REMATCH[1]}.apk"
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: steps.release.outputs.tag != ''
        with:
          # Set only when the tag does not exist yet, which creates it on the release commit.
          tag_name: ${{ steps.release.outputs.tag }}
          target_commitish: ${{ steps.release.outputs.target }}
          name: ${{ steps.release.outputs.tag }}
          body_path: ${{ steps.release.outputs.notes }}
          files: app/build/outputs/apk/release/ClimbTheWorld-Release-*.apk
          # Fail rather than publish a release without APKs.
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
