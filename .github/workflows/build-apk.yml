name: Build Android Release APK

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # A "Release v2026.10-2" commit message tags that commit and publishes it as a release,
      # described by the "=2026.10-2=" section of changelog.md.
      - name: Detect release commit
        id: release
        shell: bash
        run: |
          SUBJECT=$(git log -1 --format=%s)
          if [[ ! "$SUBJECT" =~ ^Release\ (v[^[:space:]]+)$ ]]; then
            echo "Not a release commit."
            exit 0
          fi
          TAG="${BASH_REMATCH[1]}"
          VERSION="${TAG#v}"

          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null; then
            echo "::error::Tag $TAG already exists."
            exit 1
          fi
          if ! grep -q "versionName = \"$VERSION\"" app/build.gradle; then
            echo "::error::versionName in app/build.gradle is not $VERSION."
            exit 1
          fi

          # The section runs from its heading, minus the ==== underline, to the next heading.
          awk -v heading="=$VERSION=" '
            $0 == heading { found = 1; getline; next }
            found && /^=.+=$/ { exit }
            found { print }
          ' changelog.md > "$RUNNER_TEMP/release_notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/release_notes.md"; then
            echo "::error::No =$VERSION= section in changelog.md."
            exit 1
          fi

          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "notes=$RUNNER_TEMP/release_notes.md" >> $GITHUB_OUTPUT

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Unsigned Release APK
        run: ./gradlew assembleRelease

      - name: Setup build tool version variable
        shell: bash
        run: |
          BUILD_TOOLS_VERSION=$(ls /usr/local/lib/android/sdk/build-tools/ | tail -n 1)
          echo "BUILD_TOOLS_VERSION=$BUILD_TOOLS_VERSION" >> $GITHUB_ENV
          echo "Using pre-installed Build Tools Version: $BUILD_TOOLS_VERSION"

      - name: Sign Release APK
        uses: r0adkll/sign-android-release@v1
        id: sign_app
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: ${{ env.BUILD_TOOLS_VERSION }}

      - name: Rename Signed APK
        shell: bash
        run: |
          OLD_PATH="${{ steps.sign_app.outputs.signedReleaseFile }}"
          NEW_PATH="app/build/outputs/apk/release/ClimbTheWorld-Release.apk"
          mv "$OLD_PATH" "$NEW_PATH"
          echo "FINAL_APK_PATH=$NEW_PATH" >> $GITHUB_ENV

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: steps.release.outputs.tag != ''
        with:
          # The tag does not exist yet, so the release creates it on this commit.
          tag_name: ${{ steps.release.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.release.outputs.tag }}
          body_path: ${{ steps.release.outputs.notes }}
          files: ${{ env.FINAL_APK_PATH }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
