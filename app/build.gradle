apply plugin: 'com.android.application'

android {
    compileSdk = 37
    defaultConfig {
        applicationId = "com.climbtheworld.app"
        minSdk = 29
        targetSdk = 37
        versionCode = 1
        versionName = "2026.10-6"
        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
        javaCompileOptions {
            annotationProcessorOptions {
                arguments.put("room.schemaLocation", "$projectDir/schemas".toString())
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled = false
        }
    }
    // Two builds of the same app, which install over each other: foss, all free software, and
    // nonFoss, which adds what needs libraries that are not free software. So far that is Google's
    // ARCore, which the A.R. view tracks the camera with and the node editor places nodes in A.R.
    // with. F-Droid and IzzyOnDroid take the foss build. Each has its own ArCoreFeatures, in
    // src/foss and src/nonFoss.
    flavorDimensions "distribution"
    productFlavors {
        foss {
            dimension = "distribution"
        }
        nonFoss {
            dimension = "distribution"
            // The variant Android Studio selects after a sync, as it has every feature to try.
            // Release builds are not affected.
            isDefault = true
        }
    }
    // Leave out the dependency list that only Google can decrypt, which F-Droid and IzzyOnDroid flag.
    dependenciesInfo {
        includeInApk = false
        includeInBundle = false
    }
    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    testOptions {
        // Used for Unit testing Android dependent elements in /test folder
        unitTests.includeAndroidResources = true
        unitTests.returnDefaultValues = true
    }
    namespace = 'com.climbtheworld.app'

}

repositories {
    google()
    maven { url "https://jitpack.io" }
    mavenCentral()
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'androidx.media:media:1.8.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.2'
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'org.apache.commons:commons-lang3:3.21.0'

    //camera
    // CameraX core library using camera2 implementation
    implementation "androidx.camera:camera-core:1.6.2"
    implementation "androidx.camera:camera-camera2:1.6.2"
    implementation "androidx.camera:camera-lifecycle:1.6.2"
    implementation "androidx.camera:camera-video:1.6.2"

    implementation "androidx.camera:camera-view:1.6.2"
    implementation "androidx.camera:camera-extensions:1.6.2"

    implementation "org.shredzone.commons:commons-suncalc:3.11"

    implementation 'com.squareup.okhttp3:okhttp:5.5.0'
    // The OpenStreetMap login page opens in a browser tab.
    implementation 'androidx.browser:browser:1.8.0'

    implementation 'org.maplibre.gl:android-sdk:13.6.1'

    //multithreading handler
    implementation 'com.zsoltsafrany:needle:1.0.0'

    // walkie-talkie hands-free voice activity detection
    implementation 'com.github.gkonovalov.android-vad:webrtc:2.0.10'

    // The A.R. view's tracking and the A.R. placement in the node editor, in the nonFoss build
    // only. Optional at runtime: it needs Google Play Services for AR, which is not free software
    // and not on every phone; see src/nonFoss/AndroidManifest.xml.
    nonFossImplementation 'com.google.ar:core:1.56.0'

    //database
    implementation 'androidx.room:room-runtime:2.8.5'
    annotationProcessor 'androidx.room:room-compiler:2.8.5'

    implementation 'org.locationtech.jts:jts-core:1.20.0'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.mockito:mockito-core:5.24.0'
    testImplementation 'androidx.arch.core:core-testing:2.2.0'
    testImplementation 'org.robolectric:robolectric:4.17'
    androidTestImplementation('androidx.test.espresso:espresso-core:3.4.0', {
        exclude group: 'com.android.support', module: 'support-annotations'
    })
}
