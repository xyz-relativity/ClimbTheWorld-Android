apply plugin: 'com.android.application'

// The release workflow passes the Mapbox token from a GitHub secret; locally it can be set in
// ~/.gradle/gradle.properties. Builds without one, such as F-Droid's, have no satellite layer.
def mapboxAccessToken = providers.environmentVariable('MAPBOX_ACCESS_TOKEN')
        .orElse(providers.gradleProperty('MAPBOX_ACCESS_TOKEN'))
        .getOrElse('')
        .trim()
// The token goes into a Java string literal and a tile URL as it is.
if (!(mapboxAccessToken ==~ /[A-Za-z0-9._-]*/)) {
    throw new GradleException('MAPBOX_ACCESS_TOKEN holds characters a Mapbox token does not have.')
}

android {
    compileSdk = 37
    defaultConfig {
        applicationId = "com.climbtheworld.app"
        minSdk = 29
        targetSdk = 37
        versionCode = 1
        versionName = "2026.10-3"
        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
        buildConfigField('String', 'MAPBOX_ACCESS_TOKEN', "\"${mapboxAccessToken}\"")
        javaCompileOptions {
            annotationProcessorOptions {
                arguments.put("room.schemaLocation", "$projectDir/schemas".toString())
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles(getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro')
        }
    }
    // The release workflow passes -PabiSplits to also build one APK per CPU type, each with only its
    // own copy of the MapLibre native library, next to the universal APK carrying all four.
    splits {
        abi {
            enable = project.hasProperty('abiSplits')
            reset()
            include('arm64-v8a', 'armeabi-v7a', 'x86', 'x86_64')
            universalApk = true
        }
    }
    // Leave out the dependency list that only Google can decrypt, which F-Droid and IzzyOnDroid flag.
    dependenciesInfo {
        includeInApk = false
        includeInBundle = false
    }
    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }
    buildFeatures {
        buildConfig = true
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    testOptions {
        // Used for Unit testing Android dependent elements in /test folder
        unitTests.includeAndroidResources = true
        unitTests.returnDefaultValues = true
    }
    namespace = 'com.climbtheworld.app'

}

repositories {
    google()
    maven { url "https://jitpack.io" }
    mavenCentral()
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'androidx.media:media:1.8.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.2'
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'org.apache.commons:commons-lang3:3.21.0'

    //camera
    // CameraX core library using camera2 implementation
    implementation "androidx.camera:camera-core:1.6.2"
    implementation "androidx.camera:camera-camera2:1.6.2"
    implementation "androidx.camera:camera-lifecycle:1.6.2"
    implementation "androidx.camera:camera-video:1.6.2"

    implementation "androidx.camera:camera-view:1.6.2"
    implementation "androidx.camera:camera-extensions:1.6.2"

    implementation "org.shredzone.commons:commons-suncalc:3.11"

    implementation 'com.squareup.okhttp3:okhttp:5.5.0'
    // The OpenStreetMap login page opens in a browser tab.
    implementation 'androidx.browser:browser:1.8.0'

    implementation 'org.maplibre.gl:android-sdk:13.6.1'

    //multithreading handler
    implementation 'com.zsoltsafrany:needle:1.0.0'

    // walkie-talkie hands-free voice activity detection
    implementation 'com.github.gkonovalov.android-vad:webrtc:2.0.10'

    // ARCore library
//    implementation 'com.google.ar:core:1.13.0'

    //database
    implementation 'androidx.room:room-runtime:2.8.5'
    annotationProcessor 'androidx.room:room-compiler:2.8.5'

    implementation 'org.locationtech.jts:jts-core:1.20.0'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.mockito:mockito-core:5.24.0'
    testImplementation 'androidx.arch.core:core-testing:2.2.0'
    testImplementation 'org.robolectric:robolectric:4.17'
    androidTestImplementation('androidx.test.espresso:espresso-core:3.4.0', {
        exclude group: 'com.android.support', module: 'support-annotations'
    })
}
